---
{{- if .Values.horizontalPodAutoscaler.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: {{ include "project-helm.fullname" $ }}-hpa
  namespace: {{ .Release.Namespace }}

  labels:
    {{- include "project-helm.labels" $ | nindent 4 }}

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "project-helm.fullname" $ }}

  maxReplicas: {{ .Values.horizontalPodAutoscaler.maxReplicas }}
  minReplicas: {{ .Values.horizontalPodAutoscaler.minReplicas }}

  metrics:

    {{- if .Values.horizontalPodAutoscaler.metrics.cpu }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.horizontalPodAutoscaler.metrics.cpu.averageUtilization }}
    {{- end }}

    {{- if .Values.horizontalPodAutoscaler.metrics.memory }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.horizontalPodAutoscaler.metrics.memory.averageUtilization }}
    {{- end }}

{{- end }}
