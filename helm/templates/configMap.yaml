---
{{- if gt (len .Values.configMap) 0 }}
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "project-helm.fullname" $ }}-configmap
  namespace: {{ .Release.Namespace }}

  labels:
    {{- include "project-helm.labels" $ | nindent 4 }}

data:
  {{- range $k, $v := .Values.configMap }}
  {{ $k }}: {{ $v | toYaml | indent 2 | trim }}
  {{- end }}
{{- end }}
