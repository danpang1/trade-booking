---

clone:
  depth: 10

image:
  name: 942117878223.dkr.ecr.ap-northeast-1.amazonaws.com/platform/pipeline-images:atlassian-default-image-4-0.0.26
  aws:
    access-key: $AWS_ACCESS_KEY_ID_CI
    secret-key: $AWS_SECRET_ACCESS_KEY_CI

options:
  docker: true

definitions:
  services:
    docker:
      image: public.ecr.aws/docker/library/docker:27-dind
      memory: 2048

  caches:
    docker-local: /tmp/cache/buildx
    npm: node_modules

  steps:
    - step: &prepareEnv
        name: Prepare environment variables
        runs-on:
          - 'self.hosted'
          - 'linux'
          - 'jp.k8'
        script:
          - rm -f setup_env.sh
          - bash ./.pipelines/generate-env.sh
        artifacts:
          - setup_env.sh

    - step: &pythonLint
        name: Linter execution for python
        runs-on:
          - 'self.hosted'
          - 'linux'
          - 'jp.k8'
        script:
          - bash ./scripts/lint_python.sh

    - step: &helmLint
        name: Linter execution for Helm
        image: alpine/k8s:1.26.1
        runs-on:
          - 'self.hosted'
          - 'linux'
          - 'jp.k8'
        script:
          - bash ./scripts/lint_helm.sh

    - step: &secretscan
        name: Gitleaks Scan
        runs-on:
          - 'self.hosted'
          - 'linux'
          - 'jp.k8'
        script:
          - gitleaks dir . --config /opt/.gitleaks.toml --verbose --redact --exit-code 1

    - step: &dockerBuild
        name: Build container image
        runs-on:
          - 'self.hosted'
          - 'linux'
          - 'jp.k8'
        script:
          - source setup_env.sh
          - bash ./scripts/package_docker.sh
        services:
          - docker

    - step: &dockerBuildAndPublish
        name: Build and publish container image
        runs-on:
          - 'self.hosted'
          - 'linux'
          - 'jp.k8'
        script:
          - source setup_env.sh
          - bash ./scripts/package_and_publish_docker.sh
        services:
          - docker
        caches:
          - docker
          - docker-local

    - step: &dockerTest
        name: Run pytest inside container
        runs-on:
          - 'self.hosted'
          - 'linux'
          - 'jp.k8'
        script:
          - source setup_env.sh
          # Build the `test` target stage and load it locally.
          - export IMAGE_BUILD_ARGS="--target test --load"
          - bash ./scripts/package_docker.sh
          - docker run --name test "$IMAGE_NAME:$VERSION"
        services:
          - docker

    - step: &helmBuild
        name: Build helm chart
        image: alpine/k8s:1.26.1
        runs-on:
          - 'self.hosted'
          - 'linux'
          - 'jp.k8'
        script:
          - source setup_env.sh
          - bash ./scripts/package_helm.sh

    - step: &deployUat
        name: Deploy to UAT
        image: alpine/k8s:1.26.1
        trigger: manual
        runs-on:
          - 'self.hosted'
          - 'linux'
          - 'jp.k8'
        script:
          - source setup_env.sh
          # Pin this step to UAT regardless of which branch it runs on.
          #   ENVIRONMENT -> selects deploy_k8s-uat.sh + helm_values/base-uat.yaml.
          #   KUBE_CLUSTER_NAME -> kubeconfig context used by prepare-kubectl.sh.
          #   KUBE_CLUSTER_CONFIG -> base64 kubeconfig for the UAT cluster.
          - export ENVIRONMENT="uat"
          - export KUBE_CLUSTER_NAME="test-rancher"
          - export KUBE_CLUSTER_CONFIG="$RANCHER_KUBE_CONFIG_TEST_JP_CLUSTER"
          - bash ./.pipelines/deploy.sh

    - step: &deployProd
        name: Deploy to production
        image: alpine/k8s:1.26.1
        trigger: manual
        runs-on:
          - 'self.hosted'
          - 'linux'
          - 'jp.k8'
        script:
          - source setup_env.sh
          # Pin this step to prod regardless of which branch it runs on.
          - export ENVIRONMENT="prod"
          - export KUBE_CLUSTER_NAME="sg-rancher"
          - export KUBE_CLUSTER_CONFIG="$RANCHER_KUBE_CONFIG_SG_CLUSTER"
          - bash ./.pipelines/deploy.sh

    - step: &rollbackUat
        name: Rollback UAT
        image: alpine/k8s:1.26.1
        trigger: manual
        runs-on:
          - 'self.hosted'
          - 'linux'
          - 'jp.k8'
        script:
          - source setup_env.sh
          - export ENVIRONMENT="uat"
          - export KUBE_CLUSTER_NAME="test-rancher"
          - export KUBE_CLUSTER_CONFIG="$RANCHER_KUBE_CONFIG_TEST_JP_CLUSTER"
          - bash ./.pipelines/rollback.sh

    - step: &rollbackProd
        name: Rollback production
        image: alpine/k8s:1.26.1
        trigger: manual
        runs-on:
          - 'self.hosted'
          - 'linux'
          - 'jp.k8'
        script:
          - source setup_env.sh
          - export ENVIRONMENT="prod"
          - export KUBE_CLUSTER_NAME="sg-rancher"
          - export KUBE_CLUSTER_CONFIG="$RANCHER_KUBE_CONFIG_SG_CLUSTER"
          - bash ./.pipelines/rollback.sh


pipelines:

  branches:

    main:
      - step: *prepareEnv

      - parallel:
        - step: *pythonLint
        - step: *helmLint
        - step: *secretscan
        - step: *dockerTest

      - parallel:
        # Builds and pushes the image to ECR so the cluster can pull it.
        # Requires AWS_ACCESS_KEY_ID_CI / AWS_SECRET_ACCESS_KEY_CI / AWS_ECR_URL_NEA
        # repo variables to be configured in Bitbucket.
        - step: *dockerBuildAndPublish
        - step: *helmBuild

      # Manual deploy + rollback steps for each environment, all triggered
      # independently so any one can be run without blocking the others.
      - parallel:
        - step: *deployUat
        - step: *deployProd
        - step: *rollbackUat
        - step: *rollbackProd

  pull-requests:
    '**':
      - step: *prepareEnv

      - parallel:
        - step: *pythonLint
        - step: *helmLint
        - step: *dockerTest

      - parallel:
        - step: *dockerBuild
        - step: *helmBuild
