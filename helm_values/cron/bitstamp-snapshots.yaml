---
# Bitstamp balance + position hourly snapshot.
# Release: cron-bitstamp-snapshots-<env>. Renders one CronJob, no Deployment.
#
# Isolated from venue-snapshots ON PURPOSE: Bitstamp needs an API key (Vault-
# injected in prod — see bitstamp-snapshots-prod.yaml), so giving it its own
# CronJob means a credential / Vault-agent failure can never break the public-
# venue snapshots. Runs scripts/snapshot_bitstamp.py once per UTC hour, writing
# to middle_office.tq_hist_balance_mo and tq_hist_position_mo. DB creds come
# from the shared MO_DB_* env_secrets in helm_values/base.yaml.

deployment:
  enabled: false

# NOTE: `name` is appended to the release name to form the CronJob resource
# name (`<release>-<name>-cronjob`), which k8s caps at 52 chars. The release is
# already `cron-bitstamp-snapshots-<env>`, so keep this short (`bitstamp`, not
# `bitstamp-snapshots`) to avoid overflow.
cronjobs:
  - name: bitstamp
    enabled: true
    schedule: "0 * * * *"   # top of every UTC hour
    command: ["python", "/opt/app/scripts/snapshot_bitstamp.py"]
    args: []
