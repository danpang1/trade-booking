---
# Trade-booking Node API server.
# Release: trade-booking-server-<env>.
# Renders a Deployment + Service + Ingress, no CronJobs.

deployment:
  args: ["node", "server.js"]
  replicas: 1

service:
  enabled: true
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5181

ingress:
  name: default
  enabled: true
  external: false
  path: /
  pathType: Prefix
  service:
    portName: http
  authentication:
    enabled: true

# Vault is prod-only — see helm_values/trade-booking/server-prod.yaml.
# Non-prod envs (e.g. UAT) have no Vault role/auth-path, so enabling it
# here globally would leave the agent-inject init container hanging.

observability:
  liveness:
    enabled: true
    livenessPort: 5181
    livenessPath: /api/health
