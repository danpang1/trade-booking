---
# Trade-booking server — UAT overrides.

ingress:
  host: test-jp-tms.internal.tokkalabs.com
  authentication:
    enabled: false

# Binance VIP loan READ-ONLY keys for the Loan Enquiry LTV tile.
# UAT reads them from Vault via the agent-inject sidecar — the SAME
# mechanism as prod (see helm_values/trade-booking/server-prod.yaml and
# binance_vip_loan_ltv.py, which loads /vault/secrets/gw_secret.json) —
# but pointed at the UAT Vault server, auth path and role.
vault:
  enabled: true
  service: https://test-jp-vault.internal.tokkalabs.com
  authPath: "auth/kubernetes/uat-k8s"
  role: "vault-main-trading-test"
  agentInjectDefaultTemplate: json
  agentInjectSecrets:
      paths:
        # KV v2 engine: the read path needs the "/data/" segment, otherwise
        # the json template's {{ .Data.data }} resolves to empty (creds not
        # found). gw_secret.json lands at /vault/secrets/gw_secret.json.
        gw_secret.json: "kv/data/read_only/uat/cex"
