---
# Trade-booking server — production overrides.

deployment:
  replicas: 2  # HA pair in prod

ingress:
  host: sg-tms.internal.tokkalabs.com
  # TODO: re-enable once SSO is wired up in the SG cluster.
  # Leaving on with the chart-default placeholder ssoOauth2Signin
  # caused nginx auth_request to 500 every UI request.
  authentication:
    enabled: false

vault:
  enabled: true
  authPath: "auth/kubernetes/sg-k8s"
  role: "vault-main-trading-prod"
  agentInjectDefaultTemplate: json
  agentInjectSecrets:
      paths:
        # KV v2 engine: the read path needs the "/data/" segment, otherwise
        # the json template's {{ .Data.data }} resolves to nothing and the
        # injected gw_secret.json comes through empty (creds not found).
        gw_secret.json: "kv/data/read_only/prod/cex"