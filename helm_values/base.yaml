---
# Trade-booking — values SHARED by every release of this service.
#
# Layout:
#   helm_values/base.yaml              <-- you are here (shared by all instances)
#   helm_values/base-<env>.yaml        (shared env-level overrides)
#   helm_values/deployment/base.yaml   (Node API Deployment + Service + Ingress)
#   helm_values/deployment/<env>.yaml  (per-env tweaks for the deployment)
#   helm_values/cron/base.yaml         (refdata sync CronJobs)
#
# `instance` is the third arg to scripts/run_helm.sh and selects which
# release shape to deploy (instance=deployment or instance=cron). See
# scripts/utils.sh for the value-file precedence order.

image:
  repository: 942117878223.dkr.ecr.ap-northeast-1.amazonaws.com/middle-office/trade-booking

# Env vars baked into every container (deployment + cronjobs both inherit).
env:
  APP_NAME: trade-booking
  APP_PORT: 5181
  APP_HOST: 0.0.0.0
  # ENVIRONMENT is set per-env in base-<env>.yaml.

# DB credentials. Each entry references a k8s Secret created out-of-band by
# the platform team. Naming convention: trade-booking-<block>-<env>.
# Both releases inherit the full set so the cronjob scripts (which need
# SG_RO_MYSQL_* and TOKEN_PRICE_*) and the API (which uses MO_DB_*) can
# resolve their respective creds from the same chart-level defaults.
env_secrets:
  # Postgres MO DB — used by cashflow_db.py / loan_db.py / apply_schema_*.py.
  MO_DB_HOST:
    name: trade-booking-mo-db
    key: host
  MO_DB_PORT:
    name: trade-booking-mo-db
    key: port
  MO_DB_DATABASE:
    name: trade-booking-mo-db
    key: database
  MO_DB_USERNAME:
    name: trade-booking-mo-db
    key: username
  MO_DB_PASSWORD:
    name: trade-booking-mo-db
    key: password
  # MySQL read-only — used by sync_counterparties/portfolios/users.
  SG_RO_MYSQL_HOST:
    name: trade-booking-sg-ro-mysql
    key: host
  SG_RO_MYSQL_USERNAME:
    name: trade-booking-sg-ro-mysql
    key: username
  SG_RO_MYSQL_PASSWORD:
    name: trade-booking-sg-ro-mysql
    key: password
  # MySQL token-price DB — used by snapshot_tokens.py.
  TOKEN_PRICE_HOST:
    name: trade-booking-token-price
    key: host
  TOKEN_PRICE_USERNAME:
    name: trade-booking-token-price
    key: username
  TOKEN_PRICE_PASSWORD:
    name: trade-booking-token-price
    key: password

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
