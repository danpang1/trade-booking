---
# Trade-booking — values SHARED by every release of this service.
#
# Layout:
#   helm_values/base.yaml              <-- you are here (shared by all instances)
#   helm_values/base-<env>.yaml        (shared env-level overrides)
#   helm_values/deployment/base.yaml   (Node API Deployment + Service + Ingress)
#   helm_values/deployment/<env>.yaml  (per-env tweaks for the deployment)
#   helm_values/cron/base.yaml         (refdata sync CronJobs)
#
# `instance` is the third arg to scripts/run_helm.sh and selects which
# release shape to deploy (instance=deployment or instance=cron). See
# scripts/utils.sh for the value-file precedence order.

image:
  repository: 942117878223.dkr.ecr.ap-northeast-1.amazonaws.com/middle-office/trade-booking

# Env vars baked into every container (deployment + cronjobs both inherit).
env:
  APP_NAME: trade-booking
  APP_PORT: 5181
  APP_HOST: 0.0.0.0
  # ENVIRONMENT is set per-env in base-<env>.yaml.

# DB credentials. All keys live in a single k8s Secret named
# `trade-booking-mo-db` (created out-of-band by the platform team).
# Both release shapes inherit the full set so the cron scripts (which
# read T2X_RO_MYSQL_*) and the API (which reads MO_DB_*) can resolve
# their respective creds from the same chart-level defaults.
env_secrets:
  # Postgres MO DB — used by cashflow_db.py / loan_db.py / apply_schema_*.py.
  MO_DB_HOST:
    name: trade-booking-mo-db
    key: host
  MO_DB_PORT:
    name: trade-booking-mo-db
    key: port
  MO_DB_DATABASE:
    name: trade-booking-mo-db
    key: database
  MO_DB_USERNAME:
    name: trade-booking-mo-db
    key: username
  MO_DB_PASSWORD:
    name: trade-booking-mo-db
    key: password
  # MySQL t2x read-only DB — used by sync_counterparties.py,
  # sync_portfolios.py, sync_users.py and snapshot_tokens.py.
  # Keys are namespaced inside the shared `trade-booking-mo-db` Secret to
  # avoid colliding with the Postgres MO_DB_* keys (which use `host`,
  # `port`, etc.).
  T2X_RO_MYSQL_HOST:
    name: trade-booking-mo-db
    key: t2x_ro_mysql_host
  T2X_RO_MYSQL_USERNAME:
    name: trade-booking-mo-db
    key: t2x_ro_mysql_username
  T2X_RO_MYSQL_PASSWORD:
    name: trade-booking-mo-db
    key: t2x_ro_mysql_password
  # MySQL Token Price DB credentials for scripts/rates_latest.py
  # belong here, but the chart's secretKeyRef rendering doesn't
  # support `optional: true`, so referencing keys that don't yet
  # exist in the `trade-booking-mo-db` Secret blocks the pod from
  # becoming Ready (helm upgrade rolls back via --atomic). Re-add
  # the three entries below ONCE the platform team has populated
  # mysql_token_price_db_{host,username,password} in the Secret:
  #
  # MYSQL_TOKEN_PRICE_DB_HOST:
  #   name: trade-booking-mo-db
  #   key: mysql_token_price_db_host
  # MYSQL_TOKEN_PRICE_DB_USERNAME:
  #   name: trade-booking-mo-db
  #   key: mysql_token_price_db_username
  # MYSQL_TOKEN_PRICE_DB_PASSWORD:
  #   name: trade-booking-mo-db
  #   key: mysql_token_price_db_password
  #
  # While these are commented out the rates endpoint returns HTTP 500
  # in deployed envs — the front-end footnote will read
  # "Rates: unavailable — HTTP 500" and the Dashboard composition
  # donut renders without USD valuation. Everything else is unaffected.

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m