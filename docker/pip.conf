[global]
index-url = https://pypi.org/simple/

# All runtime + test deps (psycopg2-binary, PyMySQL, pytest, flake8) are
# on public pypi; no internal mirror needed. The template's
# extra-index-url referenced pypi.internal.tokkalabs.com but its
# hostname didn't match the trusted-host entry
# (pypi.artifactory.intra.tokkalabs.com), so TLS validation failed
# inside the Docker build. Dropped both — re-add only if a private
# package gets pulled in, and make sure the hostnames match.
trusted-host =
  pypi.org
  files.pythonhosted.org
